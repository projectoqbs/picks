# Pipeline: baja fixtures/resultados y regenera las predicciones de la app.
name: actualizar predicciones

on:
  schedule:
    - cron: "0 6,14 * * *"   # 06:00 y 14:00 UTC
  workflow_dispatch: {}         # ejecucion manual desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bajar resultados y fixtures
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: python actualizar.py

      - name: Generar predicciones
        run: python generar_predicciones.py

      - name: Commit de los datos nuevos
        run: |
          git config user.name "pronostico-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data futbol.db
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "datos: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
